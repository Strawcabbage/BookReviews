# Flyway migrate command for h2
#mvn `
#"-Dflyway.url=jdbc:h2:file:$env:USERPROFILE/bookreviews-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH" `
#"-Dflyway.user=sa" `
#"-Dflyway.password=" `
#flyway:migrate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration/dev
spring.flyway.clean-disabled=false